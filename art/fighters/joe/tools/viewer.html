<!doctype html>
<html><head><meta charset="utf-8"><title>Fighter check</title>
<style>html,body{margin:0;background:#202428;overflow:hidden;color:#fff;font:13px sans-serif}#info{position:fixed;left:8px;top:8px;background:#0008;padding:6px 10px;white-space:pre}</style>
</head><body><div id="info">loading…</div>
<script type="module">
// Game-side check of the compressed fighter GLBs: three.js r187 (the game's vendor bundle), the game's anim pack,
// ACES + bloom like the prototype. URL: ?ids=joe,instructor&clip=Idle_Loop&t=0.4 (t = frozen fraction of the clip)
import * as THREE from '/public/vendor/three.bundle.js';
const { GLTFLoader, MeshoptDecoder, SkeletonUtils, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, RoomEnvironment } = THREE;
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'joe,instructor').split(',');
const clipName = q.get('clip') || 'Idle_Loop';
const tFrac = q.has('t') ? +q.get('t') : null;
const az = +(q.get('az') || 0) * Math.PI / 180;
const info = document.getElementById('info');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3038);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);
const rimA = new THREE.DirectionalLight(0x66aaff, 2.2); rimA.position.set(-6, 3, -5); scene.add(rimA);
const rimB = new THREE.DirectionalLight(0xff9955, 1.6); rimB.position.set(6, 2, -5); scene.add(rimB);
scene.add(new THREE.HemisphereLight(0x8899bb, 0x332211, 0.4));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x4a4e52, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 0.85));
composer.addPass(new OutputPass());
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));
const [anims, ...gltfs] = await Promise.all([load('/public/assets/anim/test.glb'), ...ids.map(id => load(`/public/assets/fighters/${id}.glb`))]);
const clip = anims.animations.find(c => c.name === clipName);
const mixers = [];
let lines = [];
gltfs.forEach((g, i) => {
  const obj = SkeletonUtils.clone(g.scene);
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  obj.position.x = (i - (gltfs.length - 1) / 2) * 1.3;
  scene.add(obj);
  const mixer = new THREE.AnimationMixer(obj);
  const act = mixer.clipAction(clip);
  act.play();
  if (tFrac !== null) { mixer.setTime(clip.duration * tFrac); }
  mixers.push(mixer);
  const box = new THREE.Box3().setFromObject(obj);
  let tris = 0; const mats = new Set();
  obj.traverse(o => { if (o.isMesh) { tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; [].concat(o.material).forEach(m => mats.add(m.name)); } });
  lines.push(`${ids[i]}: h=${(box.max.y - box.min.y).toFixed(3)} tris=${tris} mats=${[...mats].join(',')}`);
});
info.textContent = `clip ${clipName} ${clip ? clip.duration.toFixed(2) + 's' : 'MISSING'}\n` + lines.join('\n');
const target = new THREE.Vector3(0, 1.0, 0);
const dist = 3.2 + gltfs.length * 1.2;
camera.position.set(Math.sin(az) * dist, 1.3, Math.cos(az) * dist);
camera.lookAt(target);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (tFrac === null) for (const m of mixers) m.update(dt);
  composer.render();
});
window.__ready = true;
</script></body></html>
